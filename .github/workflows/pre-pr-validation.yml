name: reset startup validation
'on':
  push:
    branches:
    - ci/validate-reset-startup-*
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Install Linux build dependencies
      run: 'sudo apt-get update

        sudo apt-get install -y --no-install-recommends build-essential clang libclang-dev libssl-dev pkg-config postgresql python3-venv python3-virtualenv

        sudo systemctl stop postgresql

        '
    - name: Install CI deps
      run: bash integration/ci/install-deps.sh
    - name: Prepare PostgreSQL 18 cluster
      run: "for cluster in /etc/postgresql/*/main; do\n  [[ -d \"$cluster\" ]] || continue\n  version=$(basename \"$(dirname \"$cluster\")\")\n  if [[ \"$version\" != 18 ]]; then sudo pg_dropcluster --stop \"$version\" main; fi\ndone\nsudo apt-get install -y --no-install-recommends postgresql-18\nif [[ ! -d /etc/postgresql/18/main ]]; then\n  sudo pg_createcluster 18 main --port=5432\nfi\nsudo systemctl stop postgresql\n"
    - uses: Swatinem/rust-cache@v2
      with:
        prefix-key: v1
        cache-on-failure: true
    - name: Setup PostgreSQL
      run: bash integration/ci/setup.sh --with-toxi
    - name: Run focused RESET and DISCARD tests
      run: cargo nextest run --profile dev -p pgdog --no-fail-fast -E 'test(reset_all) | test(discard_all) | test(backend::prepared_statements) | test(backend::protocol)'
    - name: Build PgDog
      run: cargo build --bin pgdog
    - name: Compare RESET ALL with PostgreSQL
      run: 'export PGDOG_BIN="$GITHUB_WORKSPACE/target/debug/pgdog"

        source integration/common.sh

        run_pgdog

        wait_for_pgdog

        cargo nextest run --profile integration -p integration_tests_rust -E ''test(test_reset_all_startup_parameters)''

        '
    - name: Upload regression logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: reset-startup-regression-logs
        path: 'baseline-reset.log

          integration/log.txt'
        if-no-files-found: ignore
