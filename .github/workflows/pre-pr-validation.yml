name: Issue 1670 regression validation
'on':
  push:
    branches:
    - ci/validate-1670-20260930
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Install Linux build dependencies
      run: 'sudo apt-get update

        sudo apt-get install -y --no-install-recommends build-essential clang libclang-dev libssl-dev pkg-config postgresql python3-venv python3-virtualenv

        sudo systemctl stop postgresql

        '
    - name: Install CI deps
      run: bash integration/ci/install-deps.sh
    - name: Prepare PostgreSQL 18 cluster
      run: "for cluster in /etc/postgresql/*/main; do\n  [[ -d \"$cluster\" ]] || continue\n  version=$(basename \"$(dirname \"$cluster\")\")\n\
        \  if [[ \"$version\" != 18 ]]; then sudo pg_dropcluster --stop \"$version\" main; fi\ndone\nsudo apt-get install -y --no-install-recommends\
        \ postgresql-18\nif [[ ! -d /etc/postgresql/18/main ]]; then\n  sudo pg_createcluster 18 main --port=5432\nfi\nsudo systemctl stop postgresql\n"
    - uses: Swatinem/rust-cache@v2
      with:
        prefix-key: v1
        cache-on-failure: true
    - name: Setup PostgreSQL
      run: bash integration/ci/setup.sh --with-toxi
    - name: Reproduce on main
      run: 'set -euo pipefail

        path=pgdog/src/backend/prepared_statements.rs

        git checkout 65b24375ff9f6a19d4409140432dd0d25c82b704 -- "$path"

        set +e

        cargo nextest run --profile dev -p pgdog test_cached_parse_in_aborted_transaction > baseline.log 2>&1

        result=$?

        set -e

        git checkout "$GITHUB_SHA" -- "$path"

        cat baseline.log

        test "$result" -ne 0

        grep -q "cached Parse must reach Postgres in an aborted transaction" baseline.log

        '
    - name: Prepared statement protocol regressions
      run: 'cargo nextest run --profile dev -p pgdog -E ''test(backend::prepared_statements) | test(backend::protocol) | test(test_cached_parse)
        | test(test_cached_rollback_parse) | test(test_prepare_in_transaction)'' '
    - name: Format
      run: cargo fmt --all -- --check
    - name: Clippy
      run: cargo clippy --all-targets -- -D warnings
    - name: Build PgDog
      run: cargo build --bin pgdog
    - name: Frontend cached Parse regression
      run: 'export PGDOG_BIN="$GITHUB_WORKSPACE/target/debug/pgdog"

        SCRIPT_DIR="$PWD/integration/rust"

        source integration/common.sh

        run_pgdog

        wait_for_pgdog

        (cd integration/rust && cargo nextest run --profile integration cached_parse_rejects_aborted_transaction_in_both_pooling_modes)

        stop_pgdog

        '
    - name: Ensure PgDog stopped
      if: always()
      run: bash integration/ci/ensure-pgdog-stopped.sh
    - name: Upload integration logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: issue-1670-regression-logs
        path: 'baseline.log

          integration/log.txt'
