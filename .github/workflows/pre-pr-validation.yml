name: Validate fork benchmark image
on:
  workflow_dispatch: {}
  push:
    branches:
      - ci/validate-fork-benchmark-20261020
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install CI deps
        run: bash integration/ci/install-deps.sh
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: build-v1
      - name: Build
        run: |
          cargo build --release --bin pgdog
          bin=$(cargo test --profile microbench -p pgdog --bin pgdog --features bench --no-run --message-format=json \
            | jq -r 'select(.profile.test == true and .target.name == "pgdog") | .executable')
          cp "$bin" target/release/pgdog-microbench
      - name: Build image
        run: |
          docker build --build-context bin=target/release -f benches/perf/Dockerfile -t pgdog-bench .
          docker save pgdog-bench | gzip > image.tar.gz
