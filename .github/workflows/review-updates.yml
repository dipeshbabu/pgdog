name: Verify PgDog sequence and positional INSERT reviews
'on':
  push:
    branches:
    - ci/review-updates-20261001
permissions:
  contents: read
jobs:
  sequence-coverage:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/pgdogdev/pgdog-ci:v2
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
      with:
        ref: 4cf1042f1aeac6fac817c9dedb13ed45c62027de
        persist-credentials: false
        fetch-depth: 0
    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: review-focused-oct1
    - name: Set up PostgreSQL
      run: bash integration/ci/setup.sh --with-toxi
    - name: Search-path sequence regressions
      run: cargo nextest run --profile dev -p pgdog --bin pgdog auto_id
  insert-example:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/pgdogdev/pgdog-ci:v2
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
      with:
        ref: 61dd53e8b4f9d3a0d11e6b8fc8e08bed23b19fdd
        persist-credentials: false
        fetch-depth: 0
    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: review-focused-oct1
    - name: Set up PostgreSQL
      run: bash integration/ci/setup.sh --with-toxi
    - name: Positional INSERT regressions
      run: cargo nextest run --profile dev -p pgdog --bin pgdog auto_id_implicit_columns
    - run: cargo build --bin pgdog
    - name: Live simple/prepared INSERTs on both shards
      shell: bash
      run: 'source integration/common.sh

        run_pgdog

        wait_for_pgdog

        trap stop_pgdog EXIT

        cargo nextest run --profile integration -p integration_tests_rust test_omni_implicit_insert_columns

        '
    - name: Verify the supplied-key example fails on main
      shell: bash
      run: 'source_path=pgdog/src/frontend/router/parser/rewrite/statement/auto_id.rs

        trap ''git restore -- "$source_path"'' EXIT

        python3 -c "exec(bytes.fromhex(''''))"

        set +e

        cargo nextest run --profile dev -p pgdog --bin pgdog test_auto_id_implicit_columns_preserve_supplied_key > "$RUNNER_TEMP/baseline.log" 2>&1

        test_status=$?

        set -e

        cat "$RUNNER_TEMP/baseline.log"

        test "$test_status" = 100

        grep -F ''assertion `left == right` failed'' "$RUNNER_TEMP/baseline.log"

        '
  isolate-1609:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/pgdogdev/pgdog-ci:v2
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
      with:
        ref: e5f50da0107125867bb91ee74e6bd1058b3c281c
        persist-credentials: false
    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: review-focused-oct1
    - name: Set up PostgreSQL
      run: bash integration/ci/setup.sh --with-toxi
    - name: Run failing test by name
      run: cargo nextest run --profile dev -p pgdog --bin pgdog full_identity_insert_omni_dedup --test-threads=1
  isolate-1661:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/pgdogdev/pgdog-ci:v2
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
      with:
        ref: 664955990066efd4abaf2b9902374a079c5d66cf
        persist-credentials: false
    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: review-focused-oct1
    - name: Set up PostgreSQL
      run: bash integration/ci/setup.sh --with-toxi
    - name: Run failing test by name
      run: cargo nextest run --profile dev -p pgdog --bin pgdog test_auto_mode_waits_for_each_new_primary --test-threads=1
  isolate-1705:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/pgdogdev/pgdog-ci:v2
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
      with:
        ref: b6a5d07d86bbe7ce7a4178ffbd913b74b21a9f61
        persist-credentials: false
    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: review-focused-oct1
    - name: Set up PostgreSQL
      run: bash integration/ci/setup.sh --with-toxi
    - name: Run failing test by name
      run: cargo nextest run --profile dev -p pgdog --bin pgdog full_identity_insert_omni_dedup --test-threads=1
